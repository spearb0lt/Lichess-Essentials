[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "player-prepper"
version = "0.1.1"
description = "Scout a chess opponent from their own games, and measure your preparation against them."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Shubhro Dev", email = "shubhro2004@gmail.com" }]
keywords = ["chess", "lichess", "opponent", "scouting", "preparation", "openings"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Environment :: Web Environment",
    "Framework :: FastAPI",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Games/Entertainment :: Board Games",
]
dependencies = [
    "chess>=1.11",
    "requests>=2.31",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "pydantic>=2.0",
]

[project.optional-dependencies]
# Engine suggestions for gaps, PDF export, and reading a private study as your
# book all come from the sibling app rather than a second copy of its code:
#   pip install "player-prepper[prep]"
prep = ["lichess-study-to-pdf>=0.1.0"]
dev = ["pytest>=8.0"]

[project.scripts]
prepper = "player_prepper.cli:main"

[tool.setuptools.packages.find]
include = ["player_prepper*"]

[tool.setuptools.package-data]
player_prepper = ["web/*"]

[project.urls]
Homepage = "https://github.com/spearb0lt/Lichess-Essentials"
Repository = "https://github.com/spearb0lt/Lichess-Essentials"
Issues = "https://github.com/spearb0lt/Lichess-Essentials/issues"
Documentation = "https://github.com/spearb0lt/Lichess-Essentials/blob/main/Player-Prepper/README.md"
