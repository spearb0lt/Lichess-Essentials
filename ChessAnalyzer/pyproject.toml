[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "chess-game-analyzer"
version = "0.1.2"
description = "Review any chess game -- Lichess, Chess.com or your own PGN -- with a local engine."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Shubhro Dev", email = "shubhro2004@gmail.com" }]
keywords = ["chess", "lichess", "chess.com", "pgn", "stockfish", "analysis", "game-review"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Environment :: Web Environment",
    "Framework :: FastAPI",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Games/Entertainment :: Board Games",
]
dependencies = [
    "chess>=1.11",
    "requests>=2.31",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "pydantic>=2.0",
]

[project.optional-dependencies]
# The Lichess cloud-eval fallback reuses the sibling app's ladder rather than
# carrying a second copy:
#   pip install "chess-game-analyzer[cloud]"
cloud = ["lichess-study-to-pdf>=0.1.0"]
dev = ["pytest>=8.0"]

[project.scripts]
chess-analyzer = "chess_analyzer.cli:main"

[tool.setuptools.packages.find]
include = ["chess_analyzer*"]

[tool.setuptools.package-data]
chess_analyzer = ["web/*"]

[project.urls]
Homepage = "https://github.com/spearb0lt/Lichess-Essentials"
Repository = "https://github.com/spearb0lt/Lichess-Essentials"
Issues = "https://github.com/spearb0lt/Lichess-Essentials/issues"
Documentation = "https://github.com/spearb0lt/Lichess-Essentials/blob/main/ChessAnalyzer/README.md"
