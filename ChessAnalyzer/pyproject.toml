[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "chess-analyzer"
version = "0.1.0"
description = "Review any chess game -- Lichess, Chess.com or your own PGN -- with a local engine."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "chess>=1.11",
    "requests>=2.31",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "pydantic>=2.0",
]

[project.optional-dependencies]
# The Lichess cloud-eval fallback reuses the sibling app's ladder rather than
# carrying a second copy. Install it editable from the repository root:
#   pip install -e Lichess-Study-to-PDF
cloud = ["lichess-study-to-pdf"]
dev = ["pytest>=8.0"]

[project.scripts]
chess-analyzer = "chess_analyzer.cli:main"

[tool.setuptools.packages.find]
include = ["chess_analyzer*"]

[tool.setuptools.package-data]
chess_analyzer = ["web/*"]
