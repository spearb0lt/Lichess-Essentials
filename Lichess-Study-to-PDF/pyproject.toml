[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lichess-study-to-pdf"
version = "0.1.0"
description = "Turn a Lichess study into a PDF you can step through move by move."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "chess>=1.11",
    "reportlab>=4.0",
    "svglib>=1.5",
    "pikepdf>=8.0",
    "requests>=2.31",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "pydantic>=2.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pypdfium2>=4.0"]

[project.scripts]
lichess-study-pdf = "lichess_study_pdf.cli:main"

[tool.setuptools.packages.find]
include = ["lichess_study_pdf*"]

[tool.setuptools.package-data]
lichess_study_pdf = ["web/*"]
