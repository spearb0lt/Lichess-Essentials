[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "repertoire-creator"
version = "0.1.0"
description = "Build a chess opening repertoire locally, then publish it as a Lichess study."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "chess>=1.11",
    "requests>=2.31",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "pydantic>=2.0",
]

[project.optional-dependencies]
# The PDF export reuses the sibling app rather than duplicating 2,000 lines
# of layout code. Install it editable from the repository root:
#   pip install -e Lichess-Study-to-PDF
pdf = ["lichess-study-to-pdf"]
dev = ["pytest>=8.0"]

[project.scripts]
repertoire = "repertoire_creator.cli:main"

[tool.setuptools.packages.find]
include = ["repertoire_creator*"]

[tool.setuptools.package-data]
repertoire_creator = ["web/*"]
