[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "repertoire-creator"
version = "0.1.0"
description = "Build a chess opening repertoire locally, then publish it as a Lichess study."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Shubhro Dev", email = "shubhro2004@gmail.com" }]
keywords = ["chess", "lichess", "repertoire", "openings", "study", "pgn"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Environment :: Web Environment",
    "Framework :: FastAPI",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Games/Entertainment :: Board Games",
]
dependencies = [
    "chess>=1.11",
    "requests>=2.31",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "pydantic>=2.0",
]

[project.optional-dependencies]
# The PDF export reuses the sibling app rather than duplicating 2,000 lines
# of layout code:
#   pip install "repertoire-creator[pdf]"
pdf = ["lichess-study-to-pdf>=0.1.0"]
dev = ["pytest>=8.0"]

[project.scripts]
repertoire = "repertoire_creator.cli:main"

[tool.setuptools.packages.find]
include = ["repertoire_creator*"]

[tool.setuptools.package-data]
repertoire_creator = ["web/*"]

[project.urls]
Homepage = "https://github.com/spearb0lt/Lichess-Essentials"
Repository = "https://github.com/spearb0lt/Lichess-Essentials"
Issues = "https://github.com/spearb0lt/Lichess-Essentials/issues"
Documentation = "https://github.com/spearb0lt/Lichess-Essentials/blob/main/Repertoire-Creator/README.md"
